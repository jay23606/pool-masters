<style>
:root{
 font-family:Inter,ui-sans-serif,system-ui,sans-serif;
 --bg:#07110d;--panel:#0d1d16;--panel2:#10241a;--line:#20372c;
 --green:#42d983;--text:#ecf6ef;--muted:#8fa89a;--muted2:#6d8175;
 --yes:#42d983;--yes-bg:#123526;--partial:#ffc957;--partial-bg:#2b230f;
 --no:#5a6b62;--no-bg:transparent;--star-bg:#1d4a34;--star:#8ff0bb;
}
*{box-sizing:border-box}
body{
 margin:0;color:var(--text);background:radial-gradient(circle at 20% 0,#123526 0,transparent 36%),var(--bg);
 line-height:1.5;padding-bottom:80px;
}
header{
 max-width:1180px;margin:0 auto;padding:clamp(40px,7vw,80px) clamp(20px,4vw,32px) 20px;
}
.eyebrow{color:var(--green);font-size:.72rem;font-weight:900;letter-spacing:.17em;text-transform:uppercase}
h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.03em;margin:14px 0 18px}
h1 em{font-style:normal;color:#93bda6}
header>p{color:var(--muted);max-width:680px;font-size:1.05rem;margin:0 0 8px}
.meta{color:var(--muted2);font-size:.82rem;margin-top:18px}

main{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4vw,32px)}
section{margin-bottom:56px}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h2 .n{color:var(--green);margin-right:8px}
.section-sub{color:var(--muted);font-size:.9rem;margin:0 0 20px;max-width:760px}

/* verdict cards */
.verdict-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:linear-gradient(145deg,var(--panel2),#0a1711);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 20px 50px #0005}
.card h3{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.card p{margin:0;color:var(--muted);font-size:.85rem}
.card.strength h3::before{content:"●";color:var(--green)}
.card.gap h3::before{content:"●";color:var(--partial)}

/* roadmap list */
.roadmap{display:grid;gap:10px}
.rm{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.rm .rank{font-size:1.4rem;font-weight:900;color:var(--green);min-width:28px}
.rm h4{margin:0 0 4px;font-size:.95rem}
.rm p{margin:0;color:var(--muted);font-size:.83rem}
.rm .tag{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap;align-self:start}
.tag.high{background:#2b1414;color:#ff9d9d;border:1px solid #5a2a2a}
.tag.med{background:var(--partial-bg);color:var(--partial);border:1px solid #4a3a1a}
.tag.done{background:#123526;color:#8ff0bb;border:1px solid #2f6a4b}
.rm.shipped{border-color:#2f6a4b;background:linear-gradient(145deg,#0f2a1d,#0b1c14)}
.rm.shipped .rank{color:var(--star)}
.tag.low{background:#132018;color:#9fc4ab;border:1px solid #2a4636}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:18px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.dot.yes{background:var(--yes)}
.dot.partial{background:var(--partial)}
.dot.no{background:var(--no)}
.dot.star{background:var(--star)}

/* comparison table */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:920px;font-size:.83rem}
thead th{
 position:sticky;top:0;background:#0f2117;z-index:2;
 padding:14px 12px;text-align:left;border-bottom:1px solid var(--line);
 font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
}
thead th.ours{color:var(--green)}
thead th small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted2);margin-top:3px;font-size:.7rem}
tbody th{
 position:sticky;left:0;background:var(--panel);z-index:1;
 text-align:left;padding:10px 14px;font-weight:600;font-size:.83rem;
 border-bottom:1px solid #182a20;white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid #182a20;text-align:center}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}
tbody tr:hover td,tbody tr:hover th{background:#0f2117}
td.ours,th.ours-col{background:#0e2118}
.cat-row th{
 position:static;background:var(--panel2)!important;color:var(--green);
 font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;padding:9px 14px;
 border-bottom:1px solid var(--line);border-top:1px solid var(--line);
}
.cat-row td{background:var(--panel2)}
.pill{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;font-size:.75rem;font-weight:900}
.pill.yes{background:var(--yes-bg);color:var(--yes)}
.pill.partial{background:var(--partial-bg);color:var(--partial)}
.pill.no{color:var(--no)}
.pill.star{background:var(--star-bg);color:var(--star)}

.sources{color:var(--muted2);font-size:.78rem;line-height:1.9}
.sources a{color:#8ed0ad;text-decoration:none}
.sources a:hover{text-decoration:underline}
footer{max-width:1180px;margin:40px auto 0;padding:20px clamp(20px,4vw,32px);border-top:1px solid var(--line);color:var(--muted2);font-size:.8rem}

@media (max-width:640px){
 table{font-size:.76rem}
 thead th,tbody td{padding:8px}
}
</style>
